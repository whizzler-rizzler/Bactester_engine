[project]
name = "orderbook-imbalance"
version = "0.1.0"
description = "Standalone order-book imbalance scalper on Binance L1 (bookTicker) data"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
orderbook-run = "orderbook.runner:main"
orderbook-fetch = "orderbook.l1_fetcher:main"
orderbook-synth = "orderbook.synth:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["orderbook*"]
